<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CCCare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Staatliches&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<p>Latest reading: <strong id="value">loading…</strong></p>
<p>Updated: <span id="time">–</span></p>

<script>
  const CHANNEL_ID = "3561813";
  const FEED_URL = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds/last.json`;

  async function update() {
    const valueEl = document.getElementById("value");
    try {
      const res = await fetch(FEED_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const d = await res.json();

      // ThingSpeak answers with a bare -1 when it can't serve the channel
      if (typeof d !== "object" || d === null || d.field1 == null) {
        valueEl.textContent = "no data (is the channel public?)";
        return;
      }

      valueEl.textContent = d.field1;
      document.getElementById("time").textContent =
        new Date(d.created_at).toLocaleTimeString();
    } catch (err) {
      valueEl.textContent = "unavailable";
      console.error(err);
    }
  }

  update();
  setInterval(update, 15000);   // refresh every 15 seconds
</script>
